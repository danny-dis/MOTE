name: weekly-recap
workspace: ..
capabilities: [shell, read_file, write_file, git]
max_iterations: 20
shell:
  allowed_programs: [powershell, git]
  unsafe_shell: false
models:
  - provider: gemini
    model: gemini-2.0-flash
    endpoint: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
    auth_env: GOOGLE_API_KEY
