name: git-watchdog
workspace: ..
capabilities: [git, shell, read_file, list_dir, write_file]
max_iterations: 15
shell:
  allowed_programs: [git]
  unsafe_shell: false
models:
  - provider: dmr-x
    model: auto
    endpoint: http://127.0.0.1:47113/v1/chat/completions
output_file: reports/git-watchdog-latest.md
