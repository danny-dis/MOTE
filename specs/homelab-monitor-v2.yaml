name: homelab-monitor-v2
workspace: ..
capabilities: [shell, read_file, write_file]
max_iterations: 12
shell:
  allowed_programs: [powershell, docker]
  unsafe_shell: false
models:
  - provider: openai-compatible
    model: gpt-4o-mini
    endpoint: https://api.openai.com/v1/chat/completions
    auth_env: OPENAI_API_KEY
output_file: reports/homelab-latest.md
