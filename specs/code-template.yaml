name: code-template
workspace: ..
capabilities: [shell, read_file, write_file, git]
max_iterations: 12
shell:
  allowed_programs: [cargo, rustc, python, node, git]
  unsafe_shell: false
models:
  - provider: dmr-x
    model: auto
    endpoint: http://127.0.0.1:47113/v1/chat/completions
output_file: reports/code-template-latest.md
