name: homelab-monitor
workspace: ..
capabilities: [shell, read_file, write_file]
max_iterations: 12
shell:
  allowed_programs: [powershell, docker]
  unsafe_shell: false
models:
  - provider: dmr-x
    model: auto
    endpoint: http://127.0.0.1:47113/v1/chat/completions
output_file: reports/homelab-latest.md
