name: system-info
workspace: ..
capabilities: [shell]
max_iterations: 8
shell:
  allowed_programs: [powershell]
  unsafe_shell: false
models:
  - provider: gemini
    model: gemini-2.0-flash
    endpoint: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
    auth_env: GOOGLE_API_KEY
