name: CI

on:
  push:
    branches: [production-ready]
  pull_request:
    branches: [production-ready]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Build
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked --all-targets
      - name: Test release build
        run: cargo test --locked --release --all-targets
      - name: Example agent
        run: cargo run --locked --example basic_agent
      - name: Custom-tool example
        run: cargo run --locked --example custom_tool
      - name: Verify distributable package
        if: runner.os == 'Linux'
        run: cargo package --locked
      - name: Verify public API docs
        run: cargo doc --locked --no-deps

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit
