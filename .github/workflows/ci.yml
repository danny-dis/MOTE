name: CI

on:
  workflow_call:
  push:
    branches: [production-ready]
  pull_request:
    branches: [production-ready]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Build
        run: cargo build --locked --release

      - name: Test
        run: cargo test --locked --all-targets
      - name: Test release build
        run: cargo test --locked --release --all-targets
      - name: Example agent
        run: cargo run --locked --example basic_agent
      - name: Custom-tool example
        run: cargo run --locked --example custom_tool
      - name: Install Python for SDK tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Node for SDK tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Release tooling tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Python SDK and real bridge integration
        shell: bash
        env:
          MOTE_BRIDGE: ${{ github.workspace }}/target/release/mote-bridge${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          python -m pip install "./sdk/python[test]"
          python -m pytest sdk/python/tests -q
      - name: TypeScript SDK and real bridge integration
        shell: bash
        env:
          MOTE_BRIDGE: ${{ github.workspace }}/target/release/mote-bridge${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          npm --prefix sdk/typescript ci
          npm --prefix sdk/typescript test
          npm --prefix sdk/typescript run pack:check
      - name: Rust application starter
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test --locked --manifest-path starters/rust-agent/Cargo.toml
          cargo fmt --check --manifest-path starters/rust-agent/Cargo.toml
          cargo clippy --locked --manifest-path starters/rust-agent/Cargo.toml --all-targets -- -D warnings
      - name: Verify distributable package
        if: runner.os == 'Linux'
        run: cargo package --locked
      - name: Verify public API docs
        run: cargo doc --locked --no-deps

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit
