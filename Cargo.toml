[package]
name = "mote"
version = "0.12.0"
edition = "2021"
description = "Minimal Orchestration & Task Execution"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1.1"
ureq = { version = "2.12", default-features = false, features = ["json", "native-tls"] }

[[bin]]
name = "mote"
path = "src/main.rs"
