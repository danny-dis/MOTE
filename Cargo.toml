[package]
name = "mote-agent"
version = "0.13.1"
edition = "2021"
default-run = "mote"
description = "Minimal Orchestration & Task Execution"
license = "MIT"
repository = "https://github.com/danny-dis/MOTE"
readme = "README.md"
exclude = [
    "reports/**", "!reports/.keep",
    "docs/archive/**", "test_input.txt",
]

[lib]
name = "mote"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1.1"
ureq = { version = "2.12", default-features = false, features = ["json", "native-tls"] }

[[bin]]
name = "mote"
path = "src/main.rs"
