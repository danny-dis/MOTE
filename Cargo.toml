[package]
name = "mote-agent"
version = "0.13.0"
edition = "2021"
default-run = "mote"
description = "Minimal Orchestration & Task Execution"
license = "MIT"
repository = "https://github.com/danny-dis/MOTE"
readme = "README.md"
exclude = [
    "reports/**", "!reports/.keep",
    "DESIGN_PRINCIPLES.md", "ENGINEERING.md", "HOMELAB_MONITOR.md",
    "SDK_SPEC.md", "SOVEREIGN_SCHEDULER.md", "SPEC.md",
    "docs/DOC_AUDIT_FACTS.md", "docs/LIFEOS-FABRIC-LEARNINGS.md",
    "docs/jev-integration-spec.md", "test_input.txt",
]

[lib]
name = "mote"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1.1"
ureq = { version = "2.12", default-features = false, features = ["json", "native-tls"] }

[[bin]]
name = "mote"
path = "src/main.rs"
